[package]
name = "OhMyKeymint"
version = "1.2.0"
edition = "2021"
license-file = "LICENSE.md"

[[bin]]
name = "keymint"
path = "src/main.rs"

[dependencies]
kmr-derive = { path = "derive", version = "0.1.0" }
kmr-common = { path = "common", version = "0.1.0" }
kmr-crypto-boring = { path = "boringssl", version = "0.1.0" }
kmr-ta = { path = "ta", version = "0.1.0" }
kmr-wire = { path = "wire", version = "0.1.0" }
libc = "0.2.190"
prost = "0.14.4"
hex = "0.4.3"
log4rs = { version = "1.4.0", default-features = false, features = ["all_components"] }
log = "0.4.34"
rsbinder = { version = "0.12.0", features = ["android_12_plus", "rpc"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
tokio = { version = "1.53.3", features = ["macros", "libc"] }
lazy_static = "1.5.1"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
x509-cert = "0.3.0"
watchdog_rs = { path = "watchdog", version = "0.1.0" }
nix = { version = "0.31.3", features = ["fs", "mman"] }
rsproperties = { version = "0.6.0", features = ["builder"] }
libsqlite3-sys = "0.39.1"
rand = "0.10.3"
der = "0.8.3"
toml = "1.1.8"
regex = "1.13.1"
base64 = "0.23.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
android_logger = "0.15.1"
multi_log = "0.1.2"
num_cpus = "1.17.0"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = 'abort'     # Abort on panic
strip = true        # Strip symbols from binary*
debug = 0           # Disable debug info
incremental = true

[workspace]
members = [
  "boringssl",
  "common",
  "derive",
  "ta",
  "tests",
  "wire",
  "watchdog",
  "injector",
]

[patch.crates-io]
kmr-derive = { path = "derive", version = "0.1.0" }
kmr-common = { path = "common", version = "0.1.0" }
kmr-crypto-boring = { path = "boringssl", version = "0.1.0" }
kmr-ta = { path = "ta", version = "0.1.0" }
kmr-tests = { path = "tests" }
kmr-wire = { path = "wire", version = "0.1.0" }
watchdog_rs = { path = "watchdog" }
injector = { path = "injector" }

[build-dependencies]
prost-build = "0.14.4"
rsbinder-aidl = "0.12.0"

[dev-dependencies]
ciborium = "0.2.2"
rcgen = "0.14.10"
tempfile = "3.27.0"
