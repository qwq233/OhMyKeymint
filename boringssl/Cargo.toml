# Note that Cargo is not an officially supported build tool (Android's Soong is the official
# tool).  This Cargo.toml file is included purely for the convenience of KeyMint developers.

[package]
name = "kmr-crypto-boring"
authors = ["David Drysdale <drysdale@google.com>"]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
# `nightly` enables the use of nightly-only standard library functionality,
# specifically fallible allocation. This requires nightly Rust.
nightly = []

[dependencies]
kmr-common = { path = "../common", version = "0.1.0" }
kmr-wire = { path = "../wire", version = "0.1.0" }
libc = "0.2.190"
log = "0.4.34"
anyhow = "1.0.104"
thiserror = "2.0.21"
nix = { version = "0.31.3", features = ["mman"] }
openssl = { package = "openssl", version = "0.10.81", features = ["unstable_boringssl", "bindgen"] }
ffi = { package = "openssl-sys", version = "0.9.117", features = ["bindgen"] }
bssl_sys = { package = "bssl-sys", version = "0.1.0" }
foreign-types = "0.3.2"

[dev-dependencies]
kmr-tests = { path = "../tests", version = "0.1.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(soong)'] }
