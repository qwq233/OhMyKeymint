[package]
name = "injector"
version = "1.3.0"
edition = "2021"
license-file = "../LICENSE.md"
build = "build.rs"

[[bin]]
name = "inject"
path = "src/main.rs"

[dependencies]
libc = "0.2.190"
log = "0.4.34"
kmr-common = { path = "../common", version = "0.1.0" }
nix = { version = "0.32.0", features = ["ptrace", "signal"] }
omhook = { version = "1.0.0", default-features = false, features = [ "plt" ] }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.1.8"
rand = "0.10.3"
binder = { version = "0.1.1", path = "../libs/binder", package = "android-binder" }
zerocopy = { version = "0.8.63", features = ["derive"] }
