[package]
name = "injector"
version = "1.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "inject"
path = "src/main.rs"

[dependencies]
libc = "0.2.189"
log = "0.4.33"
log4rs = "1.4.0"
kmr-common = { path = "../common" }
nix = { version = "0.31.3", features = ["ptrace", "signal"] }
lsplt-rs = "2.1.6"
anyhow = "1.0.104"
async-trait = "0.1.91"
rsbinder = { version = "0.11.0", features = ["android_12_plus", "rpc"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.3"
rand = "0.10.2"
android_logger = "0.15.1"
multi_log = "0.1.2"

[build-dependencies]
rsbinder-aidl = "0.10.0"
