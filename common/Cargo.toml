# Note that Cargo is not an officially supported build tool (Android's Soong is the official
# tool).  This Cargo.toml file is included purely for the convenience of KeyMint developers.

[package]
name = "kmr-common"
version = "0.1.0"
authors = ["David Drysdale <drysdale@google.com>"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
android_logger = "0.15.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
binder = { version = "0.1.1", path = "../libs/binder", package = "android-binder" }
cddl-cat = { version = "0.7.1", optional = true }
ciborium = { version = "0.2.2", default-features = false }
ciborium-io = "0.2.2"
coset = "0.4.2"
der = { version = "0.8.3", features = ["alloc", "derive"] }
enumn = "0.1.14"
jiff = "1.0.1"
kmr-derive = { path = "../derive", version = "0.1.0" }
kmr-wire = { path = "../wire", version = "0.1.0" }
libc = "0.2.191"
log = "0.4.35"
log4rs = { version = "1.4.0", default-features = false, features = ["console_writer", "simple_writer"] }
multi_log = "0.1.2"
pkcs1 = { version = "0.8.0", features = ["alloc"] }
pkcs8 = "0.11.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rsproperties = { version = "0.7.0", features = ["builder"] }
sec1 = { version = "0.8.1", features = ["alloc", "der"] }
serde = { version = "1.0.229", features = ["derive"] }
spki = "0.8.1"
zerocopy = { version = "0.8.64", features = ["derive"] }
zeroize = { version = "1.9.2", features = ["alloc", "zeroize_derive"] }

[dev-dependencies]
hex = "0.4.3"

[build-dependencies]
aidl-generator = { version = "0.1.0", path = "../libs/aidl" }
